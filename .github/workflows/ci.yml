name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test --all
      - name: build
        run: cargo build --release
      # Export the demo's ledger and verify it, plus the edge-case export
      # written by `cargo test`, with the independent Node verifier: proof
      # that the export is enough to audit the ledger without this crate.
      # The demo also keeps its ledger on disk, and the edge-case test keeps
      # its ledger on disk too: each file must be its export, byte for byte,
      # and verify the same way. The demo restarts its plane from the file
      # halfway through; its ledger must be the same bytes as a run without
      # the restart.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: verify exports independently
        run: |
          cargo run --release -- --export target/audit --ledger target/audit/durable.jsonl
          cargo run --release -- --export target/audit-plain
          node tools/verify-ledger.mjs target/audit/ledger.jsonl target/audit/keys.json
          node tools/verify-ledger.mjs target/audit/ledger-suffix.jsonl target/audit/keys.json
          node tools/verify-ledger.mjs target/audit/durable.jsonl target/audit/keys.json
          cmp target/audit/ledger.jsonl target/audit/durable.jsonl
          cmp target/audit-plain/ledger.jsonl target/audit/durable.jsonl
          node tools/verify-ledger.mjs target/export-fixture/edge.jsonl target/export-fixture/keys.json
          node tools/verify-ledger.mjs target/export-fixture/edge-suffix.jsonl target/export-fixture/keys.json
          node tools/verify-ledger.mjs target/export-fixture/durable.jsonl target/export-fixture/keys.json
          cmp target/export-fixture/edge.jsonl target/export-fixture/durable.jsonl
          node --test tools/verify-ledger.test.mjs
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: install
        run: npm --prefix site ci
      - name: check
        run: npm --prefix site run check
      # `check` rebuilds the site into docs/, which GitHub Pages serves. Any
      # difference from what is committed means docs/ was not rebuilt after a
      # change to site/.
      - name: docs in sync
        run: |
          if [ -n "$(git status --porcelain -- docs)" ]; then
            echo "::error::docs/ is out of date with site/. Run 'npm --prefix site run build' and commit docs/."
            git status --short -- docs
            exit 1
          fi
